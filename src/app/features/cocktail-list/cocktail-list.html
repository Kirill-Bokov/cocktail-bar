<h1>Коктейли</h1>

<a routerLink="/cocktails/new">
  Создать коктейль
</a>


@if (isLoading()) {

<p>
  Загрузка...
</p>

} @else if (cocktails().length === 0) {

<p>
  Коктейлей нет.
</p>

} @else {


@for (cocktail of cocktails(); track cocktail.id) {

<app-cocktail-card
  [cocktail]="cocktail"
/>

}


}
