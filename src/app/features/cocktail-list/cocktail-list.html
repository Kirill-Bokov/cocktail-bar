<section class="cocktail-list">

  <header class="page-header">

    <h1>Добро пожаловать в бар "Тестовое задание", что предпочитаете?</h1>

  </header>


  @if (isLoading()) {

    <p class="message">
      Загрузка...
    </p>

  } @else if (cocktails().length === 0) {

    <p class="message">
      Коктейлей нет.
    </p>

  } @else {

    <div class="grid">

      @for (cocktail of cocktails(); track cocktail.id) {

        <app-cocktail-card
          [cocktail]="cocktail"
        />

      }

    </div>

  }

</section>
