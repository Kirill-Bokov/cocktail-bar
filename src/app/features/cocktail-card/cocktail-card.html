<mat-card class="cocktail-card" (click)="openDetails()">

  <div class="image-wrapper">

    @if(imageUrl) {
    <img [src]="imageUrl" [alt]="cocktail.name">
    } @else {
    <div class="placeholder">
      <mat-icon>liquor</mat-icon>
    </div>
    }

    <div class="actions" (click)="$event.stopPropagation()">
      <button mat-icon-button aria-label="Редактировать" (click)="edit()">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button aria-label="Удалить" (click)="delete()">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </div>

  <mat-card-content>
    <h2>{{ cocktail.name }}</h2>
    <p class="description">
      {{ cocktail.description }}
    </p>
    <div class="info">
      <mat-icon>format_list_numbered</mat-icon>
      <span>
        Количество шагов в рецепте: {{ cocktail.steps.length }}
      </span>
    </div>
  </mat-card-content>
</mat-card>
