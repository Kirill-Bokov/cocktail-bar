<article>

@if(imageUrl) {

<img
  [src]="imageUrl"
  alt="Коктейль">

}


<h2>
{{ cocktail.name }}
</h2>


<p>
{{ cocktail.description }}
</p>


<p>
Шагов:
{{ cocktail.steps.length }}
</p>


<button
type="button"
(click)="openDetails()">

Подробнее

</button>


<button
type="button"
(click)="edit()">

Редактировать

</button>


<button
type="button"
(click)="delete()">

Удалить

</button>


</article>
